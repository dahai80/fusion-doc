name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  # 安全审计: 依赖漏洞扫描 (high/critical 即失败,商用级安全闸)
  # E9 修复: 客户端审计原 continue-on-error: true 致 high/critical 漏洞 CI 仍绿,
  # 与服务端阻断策略矛盾, 供应链风险静默进发布产物。改为阻断, 与服务端一致。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - name: 客户端依赖审计
        run: cd client && npm ci && npm audit --audit-level=high --omit=dev

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: cd client && npm ci && npm run build
