name: docs-validation

on:
  push:
    branches: [master, main]
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py \
            --root . \
            --product fusion-doc \
            --class platform \
            --entry service \
            --skip-dirs ".git,node_modules,docmost,.venv,.remember,.ruff_cache,logs,data,gateway/public,patches,branding"
